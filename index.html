<!DOCTYPE html>
<html lang="uz-UZ"> <!-- Tilni aniq belgilash SEO uchun muhim -->
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Birlamchi Meta Teglar -->
    <title>Golden Bell Express — Premium Logistika va Kuryerlik Xizmati</title>
    <meta name="title" content="Golden Bell Express — Premium Logistika va Kuryerlik Xizmati" />
    <meta name="description" content="O'zbekiston bo'ylab tezkor va xavfsiz yetkazib berish xizmatlari. Golden Bell Express bilan yuklaringiz ishonchli qo'llarda." />

    <meta name="author" content="Hojiakbar Sobirov" />

    <!-- Open Graph / Facebook / Telegram (Ijtimoiy tarmoqlar uchun) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://goldenbellexpress.uz/" />
    <meta property="og:title" content="Golden Bell Express — Tezkor va Xavfsiz Yetkazib Berish" />
    <meta property="og:description" content="Yuklaringizni O'zbekistonning istalgan nuqtasiga professional darajada yetkazib beramiz." />
    <meta property="og:image" content="/og-image.jpg" /> <!-- 1200x630px rasm bo'lishi tavsiya etiladi -->

    <!-- Twitter (X) uchun -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://goldenbellexpress.uz/" />
    <meta property="twitter:title" content="Golden Bell Express — Premium Logistika" />
    <meta property="twitter:description" content="O'zbekiston bo'ylab kuryerlik va logistika xizmatlari." />
    <meta property="twitter:image" content="/og-image.jpg" />

    <!-- Favicon va Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#161b22" /> <!-- Saytingizning asosiy rangi -->

    <!-- Canonical URL (Dublikat kontentni oldini olish uchun) -->
    <link rel="canonical" href="https://goldenbellexpress.uz/" />

    <!-- Google Fonts (Pre-connect orqali tezlashtirish) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
